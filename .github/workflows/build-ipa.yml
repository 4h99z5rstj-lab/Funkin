name: Build FNF iOS IPA
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      NEKOPATH: /opt/homebrew/lib/neko
      HAXE_STD_PATH: /opt/homebrew/lib/haxe/std
      HAXELIB_ROOT: ~/haxelib
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false
      - name: Install Haxe & Neko
        run: |
          brew install neko haxe
          echo "NEKOPATH=/opt/homebrew/lib/neko" >> $GITHUB_ENV
          echo "HAXE_STD_PATH=/opt/homebrew/lib/haxe/std" >> $GITHUB_ENV
          mkdir -p $HAXELIB_ROOT
          haxelib setup $HAXELIB_ROOT
      - name: Cache Haxelib
        uses: actions/cache@v3
        with:
          path: ~/haxelib
          key: fnf-haxe-v2-${{ hashFiles('hmm.json') }}
      - name: Install hmm
        run: |
          haxelib --global install hmm --quiet
          haxelib --global run hmm setup
      - name: Pre-download git deps native git
        run: |
          mkdir -p vendor
          git clone https://github.com/FunkinCrew/FlxPartialSound.git vendor/FlxPartialSound
          cd vendor/FlxPartialSound
          git reset --hard 2f984e244f1544ca98c0e03b9b21ae570f07ac55
          cd ../..
          sed -i '' 's|"FlxPartialSound": "git:.*"|"FlxPartialSound": "path:vendor/FlxPartialSound"|g' hmm.json
      - name: Install Haxe dependencies
        run: haxelib run hmm install --quiet
        timeout-minutes: 15
      - name: Build hxcpp tool
        run: |
          HXCPP_PATH=$(haxelib path hxcpp | head -1)
          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml
      - name: Install xcodeproj gem
        run: sudo gem install xcodeproj --no-document
      - name: Patch project.hxp signing
        run: sed -i '' 's/config.set("ios.team-id", IOS_TEAM_ID);/config.set("ios.team-id", "NONE");/' project.hxp
      - name: List Xcode version
        run: xcodebuild -version
      - name: Lime build iOS project
        continue-on-error: true
        env:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
        run: haxelib run lime build ios -release -D nosign
        timeout-minutes: 60
      - name: Fix pbxproj
        if: always()
        run: |
          if [ ! -d export/release/ios ]; then exit 0; fi
          cd export/release/ios
          sed -i '' 's/DevelopmentTeam = ;/DevelopmentTeam = "NONE";/g' Funkin.xcodeproj/project.pbxproj
          ruby -e 'require "xcodeproj";Xcodeproj::Project.open("Funkin.xcodeproj").save'
      - name: Xcode compile
        run: |
          if [ ! -d export/release/ios ]; then exit 1; fi
          cd export/release/ios
          xcodebuild -configuration Release -project Funkin.xcodeproj -sdk iphoneos build CODE_SIGNING_ALLOWED=NO
      - name: Package IPA
        run: |
          APP=$(find export/release/ios/build -name "*.app" | head -1)
          mkdir Payload && cp -r "$APP" Payload/
          zip -q FNF_iOS.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FNF-iOS
          path: FNF_iOS.ipa
          retention-days: 7
